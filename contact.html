<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact MusicPix | Upload or Review Music</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar md:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">MusicPix</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNavMenu" aria-controls="navbarNavMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavMenu" aria-labelledby="navbarNavMenuLabel">
        <div class="drawer-header">
          <span class="drawer-title" id="navbarNavMenuLabel">Menu</span>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">How It Works</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    <h1>Contact MusicPix</h1>
    <p class="mb-4">Want to upload your music or become a reviewer? Send us a message and we will get back to you.</p>

  <form style="max-width: 900px" action="#">
      <div class="row g-4">
        <div class="md:col-6">
          <div class="form-field">
            <label for="firstName" class="form-label">First name</label>
            <input type="text" class="form-control" id="firstName" name="firstName">
          </div>
        </div>
        <div class="md:col-6">
          <div class="form-field">
            <label for="lastName" class="form-label">Last name</label>
            <input type="text" class="form-control" id="lastName" name="lastName">
          </div>
        </div>
        <div class="md:col-6">
          <div class="form-field">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
          </div>
        </div>
        <div class="md:col-6">
          <div class="form-field">
            <label for="interest" class="form-label">I want to</label>
            <select class="form-control" id="interest" name="interest">
              <option value="upload">Upload my music</option>
              <option value="review">Review other artists' tracks</option>
              <option value="both">Upload and review</option>
              <option value="other">Something else</option>
            </select>
          </div>
        </div>
        <div class="md:col-6">
          <div class="form-field">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control" id="message" name="message" rows="5"></textarea>
          </div>
        </div>
        <div class="md:col-6">
          <div class="form-field">
            <input type="checkbox" class="check" id="consent" name="consent">
            <label for="consent">I agree to let MusicPix contact me by email.</label>
          </div>
        </div>
      </div>
      <button type="submit" class="btn-solid theme-primary mt-5">Send Message</button>
    </form>
  </main>

  <footer class="bg-1 fg-2 py-4">
    <div class="container">
      <p>&copy; 2026 MusicPix. Created by Deepak Jassi for CCT360.</p>
    </div>
  </footer>

</body>
</html>
